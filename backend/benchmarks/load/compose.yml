# Load and chaos stack (#958) — driven by ./run.sh, never started by hand.
#
# WHY A DEDICATED FILE AND NOT docker-compose.yml + docker-compose.scale.yml.
# The topology is the scale overlay's — N backend replicas built from the
# production image target, behind nginx running ops/nginx/backend-lb.conf
# verbatim — but the deployment files cannot host a disposable test run:
#   - they pin `container_name` on MySQL, Redis and the load balancer, so a run
#     would collide with a local deployment and its `down -v` could reach the
#     real volumes (the failure mode of #847);
#   - they require production secrets in .env;
#   - the database service is called `mysql`, while the Docker memory-budget
#     check every verification stack honours counts `staffscheduler-verify*-db-1`
#     containers: run.sh pins the project name `staffscheduler-verify-load`, so
#     this stack's MySQL is counted like any other.
# What is shared stays shared: the same MySQL tag (scripts/mysql-version.test.mjs
# scans this file), the same Redis line, the same backend Dockerfile and the
# same nginx config file, so a finding here is a finding about production.
#
# WHY THE DATABASE IS ON A NAMED VOLUME, unlike docker-compose.verify.yml's
# tmpfs: a tmpfs mount is discarded when its container stops, and the chaos
# run stops and restarts MySQL to observe recovery — the data must survive the
# restart or "no corrupted state" would be checked against an empty server.
# run.sh always ends with `down -v`, so nothing outlives a run.
#
# WHY NODE_ENV=development ON THE BACKEND. In production mode the API answers
# every request carrying `X-Forwarded-Proto: http` with a 301 to https and
# marks its cookies Secure; the load balancer forwards plain http, and there is
# no TLS terminator in this stack. Development mode changes neither the
# handlers, the SQL nor the middleware chain under test — only the redirect,
# cookie flags, CORS leniency and error-detail verbosity — and keeps the
# console logs that the chaos run reads for crash evidence.

services:
  db:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: load
      MYSQL_DATABASE: staff_scheduler
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    # Production's figures (docker-compose.yml): the numbers measured here are
    # meant to describe that sizing, not the workstation's.
    mem_limit: ${LOAD_DB_MEM:-512m}
    cpus: ${LOAD_DB_CPUS:-0.5}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pload"]
      interval: 2s
      timeout: 5s
      retries: 60

  redis:
    image: redis:7.4-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    mem_limit: 320m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: schema migrations and the demo seed. Built from the backend
  # Dockerfile's `build` stage, which already holds the full dev install
  # (dbmate, ts-node) and the backend sources — no npm install at run time and
  # no host tooling.
  seed:
    build:
      context: ../../..
      dockerfile: backend/Dockerfile
      target: build
    image: staffscheduler-verify-load-tools
    working_dir: /app/backend
    environment: &tools_env
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: load
      DB_NAME: staff_scheduler
      DATABASE_URL: mysql://root:load@db:3306/staff_scheduler
      NODE_ENV: development
    command: >-
      sh -c "npx dbmate --wait --migrations-dir db/migrations --no-dump-schema up
      && npx ts-node scripts/seed-demo.ts"
    depends_on:
      db:
        condition: service_healthy

  # The invariant checker (check/invariants.ts) and the report builder
  # (check/report.ts), run on demand with `run --rm checker ...`.
  checker:
    profiles: ["tools"]
    image: staffscheduler-verify-load-tools
    working_dir: /app/backend
    environment: *tools_env
    volumes:
      - ./:/app/backend/benchmarks/load:ro
      - ${LOAD_RESULTS_DIR:-./results}:/results

  backend:
    build:
      context: ../../..
      dockerfile: backend/Dockerfile
      target: production
    image: staffscheduler-verify-load-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: staff_scheduler
      DB_USER: root
      DB_PASSWORD: load
      REDIS_URL: redis://redis:6379
      JWT_SECRET: load-test-only-secret-not-for-production
      # A run longer than the default 15 min access-token lifetime would
      # otherwise measure re-authentication rather than the workload.
      JWT_EXPIRES_IN: ${LOAD_JWT_EXPIRES_IN:-4h}
      DB_POOL_LIMIT: ${LOAD_DB_POOL_LIMIT:-30}
      DB_QUEUE_LIMIT: ${LOAD_DB_QUEUE_LIMIT:-100}
      LOG_LEVEL: ${LOAD_LOG_LEVEL:-info}
      # Two hops: the load generator stands in for an outer proxy and sends a
      # distinct X-Forwarded-For per session, then backend-lb appends its own.
      # Trusting both makes every session its own client address, which is
      # what N real users are; with one hop all sessions would share k6's
      # address and the IP-keyed login limiter (10 per 15 min) would refuse
      # all but the first ten logins.
      TRUST_PROXY_HOPS: "2"
      # The organization budget (default 2000/min) caps the whole demo tenant
      # at ~33 req/s — a capacity ceiling worth knowing (methodology.md) but
      # not what this harness measures. Raised so the handlers are measured;
      # set LOAD_RATE_LIMIT_ORG_MAX=2000 to measure the limiter instead.
      RATE_LIMIT_MAX_REQUESTS: ${LOAD_RATE_LIMIT_MAX:-1000000}
      RATE_LIMIT_ORG_MAX_REQUESTS: ${LOAD_RATE_LIMIT_ORG_MAX:-1000000}
    mem_limit: ${LOAD_BACKEND_MEM:-1g}
    cpus: ${LOAD_BACKEND_CPUS:-0.5}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s

  lb:
    image: nginx:1.27-alpine
    depends_on:
      - backend
    volumes:
      - ../../../ops/nginx/backend-lb.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 128m
    cpus: 0.25

  k6:
    profiles: ["tools"]
    image: grafana/k6:1.3.0
    working_dir: /scripts
    volumes:
      - ./k6:/scripts:ro
      # The demo seed is the only source of credentials (lib.js reads both).
      - ../../scripts/fixtures/demo/data.json:/seed/data.json:ro
      - ../../scripts/seed-demo.ts:/seed/seed-demo.ts:ro
      - ${LOAD_RESULTS_DIR:-./results}:/results

volumes:
  db_data:
