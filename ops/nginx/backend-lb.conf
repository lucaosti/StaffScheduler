# Load balancer in front of the backend replicas.
#
# Used by the `backend-lb` service in docker-compose.scale.yml so the API is
# reachable on a single host port while N backend replicas serve it.
#
# WHY A VARIABLE proxy_pass: nginx resolves a hostname in a literal proxy_pass
# exactly once, at startup. `backend` resolves to one A record per replica, so a
# cached resolution would pin every request to one replica — and break outright
# when that replica is replaced during a rolling deploy. Resolving through the
# Docker DNS server with a short TTL, via a variable, re-resolves at request time
# and spreads load across whatever replicas currently exist.
server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=5s ipv6=off;

    location / {
        set $backend_upstream http://backend:3001;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events (/api/events) must stream rather than buffer, and
        # must outlive the default 60s read timeout. Safe for normal requests
        # too: responses are small and already streamed by Express.
        proxy_buffering off;
        proxy_read_timeout 1h;

        # During a rolling deploy a replica may go away mid-request; retry the
        # next one instead of surfacing a 502 to the client. nginx never
        # re-sends a request that is not idempotent (a POST) once it reached a
        # replica, so ops/deploy/rolling-deploy.sh avoids that case rather than
        # relying on this: it stops old replicas gracefully, which refuses new
        # connections — a failure nginx does retry, POSTs included, because
        # nothing was sent — while the requests already in flight complete.
        proxy_next_upstream error timeout http_502 http_503 http_504;

        # Until the resolver TTL above expires, the address list can still hold
        # a replica that has just been removed. Connecting to it fails only
        # after the kernel gives up on the address; 2s bounds that wait, so the
        # retry on a live replica lands well inside a client's timeout instead
        # of after nginx's 60s default. Replicas on the same Docker network
        # accept in milliseconds, so 2s never cuts off a healthy one.
        proxy_connect_timeout 2s;
    }
}
